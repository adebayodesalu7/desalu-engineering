<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotating Borders</title>
    <link rel="stylesheet" href="rotatebutton.css">
</head>
<body>
    <header class="box">
        <nav class="nav" aria-label="Main navigation">
            <a class="animated-control brand" href="#home"><span>Desalu Engineering</span></a>

            <div class="links">
                <a class="animated-control" href="#home"><span>Home</span></a>
                <a class="animated-control" href="#about"><span>About</span></a>
                <a class="animated-control" href="#contact"><span>Contact</span></a>
                <a class="animated-control" href="#blog"><span>Blog</span></a>
                <a class="animated-control" href="auth.html"><span>Sign in</span></a>
            </div>

            <form class="search" role="search" method="get">
                <label class="visually-hidden" for="site-search">Search this site</label>
                <input class="search-input" id="site-search" name="q" type="search" placeholder="Search...">
                <button class="animated-control" type="submit"><span>Search</span></button>
            </form>
        </nav>
    </header>
</body>
</html>
